services:
  - type: web
    name: cor-painel-ocorrencias
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11"
